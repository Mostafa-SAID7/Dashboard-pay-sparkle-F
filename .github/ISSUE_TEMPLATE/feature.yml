name: ✨ Feature Request
description: Suggest a new feature or improvement for PayFlow
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the form below to help us understand your idea.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clear description of the feature you'd like to see
      placeholder: "Describe the feature and what problem it solves"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this feature be used? Who would benefit from it?
      placeholder: |
        Example:
        - Users want to...
        - This would help when...
        - Currently, we have to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this feature should work? Any specific implementation ideas?
      placeholder: "Describe how the feature should work and what the user experience should be"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Are there alternative approaches or workarounds?
      placeholder: "Describe any alternative solutions or workarounds you've considered"
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups or Examples
      description: Add screenshots, mockups, wireframes, or links to similar implementations
      placeholder: "Drag and drop images or paste links to examples"

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low (nice to have)
        - Medium (would be helpful)
        - High (needed soon)
        - Critical (blocks my work)
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated Effort
      description: How complex do you think this feature is?
      options:
        - Small (< 1 day)
        - Medium (1-3 days)
        - Large (> 1 week)
        - Unknown
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: "Add any other context about this feature request"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing feature requests and this is not a duplicate
          required: true
        - label: I have provided a clear description of the feature
          required: true
        - label: I have explained the use case and benefits
          required: true
        - label: I am willing to help implement this feature
          required: false
