name: 🐛 Bug Report
description: Report a bug to help us improve PayFlow
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the form below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: "Describe what happened and what you expected to happen"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the bug
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "Describe what should happen"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Describe what actually happens"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Videos
      description: Add screenshots, videos, or GIFs demonstrating the bug
      placeholder: "Drag and drop images or paste video links"

  - type: dropdown
    id: environment-os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment-browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - Other
    validations:
      required: true

  - type: textarea
    id: environment-versions
    attributes:
      label: Environment Details
      description: Provide relevant version information
      placeholder: |
        - Browser version: 120.0
        - Node.js version: 22.0 (if relevant)
        - npm version: 10.0 (if relevant)
    validations:
      required: false

  - type: textarea
    id: error-messages
    attributes:
      label: Error Messages or Logs
      description: Paste any relevant error messages or console logs
      placeholder: "Paste error stack trace or console output here"
      render: bash

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context that might help us understand the issue
      placeholder: "Add any other context about the problem here"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
        - label: I have provided clear steps to reproduce the bug
          required: true
        - label: I have included error messages or logs if applicable
          required: false
        - label: I am willing to help fix this bug
          required: false
